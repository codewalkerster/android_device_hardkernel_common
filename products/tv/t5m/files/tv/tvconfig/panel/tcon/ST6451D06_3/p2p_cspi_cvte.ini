[start]
start_tag=amlogic_start


[lcd_Attr]

#version
version=1

#basic
model_name=ST6451D06-3
interface=LCD_P2P # LCD_TTL, LCD_LVDS, LCD_VBYONE, LCD_MLVDS, LCD_P2P
lcd_bits=8
screen_width=16
screen_height=9

#timming
h_active=3840
v_active=2160
h_period=5000
v_period=2250
hsync_width=16
hsync_bp=29
hsync_pol=0
vsync_width=6
vsync_bp=65
vsync_pol=0

#customer
fr_adjust_type=2 # 0-clock, 1-htotal, 2-vtotal, 3-auto_range, 4-hdmi_mode
ss_level=20 # 0-disable, 2000ppm/step
clk_auto_gen=1
pixel_clk=0 # unit in Hz

#interface

#p2p_attr
if_attr_0=0x51  #p2p_type: 0x0=ceds, 0x1=cmpi, 0x2=isp, 0x3=epi,
	# 0x10=chpi, 0x11=cspi, 0x12=usit
if_attr_1=12 #lane_num
if_attr_2=0x3210 #channel_sel0[15:0]
if_attr_3=0x7654 #channel_sel0[31:16]
if_attr_4=0xba98 #channel_sel1[15:0]
if_attr_5=0 #channel_sel1[31:16]
if_attr_6=0 #pn_swap


#phy_attr
if_attr_7=0xff20 #customer vswing_level[31:16]
if_attr_8=0xdfa1 #customer vswing_level[15:0]
if_attr_9=0x4 #preemphasis_level

#power
#power type:(0=cpu_gpio, 1=pmu_gpio, 2=signal, 3=extern, 0xff=ending)
#power index:(point gpios_index, or extern_index, 0xff=invalid)
#power value:(0=output low, 1=output high, 2=input)
#power delay:(unit in ms)

power_on_step = {
    0,0,1,20, #panel power on
    5,0,2,0, #SS freq=2 mode=0
    6,0,0,20, #enable spi
    2,0,0,0,  #signal enable
    3,0,0,30, #pmu power on
    0xff,0,0,0, #ending
};

power_off_step = {
    2,0,0,20,  #signal disable
    0,0,0,1100, #panel power off
    0xff,0,0,0, #ending
};


[lcd_ext_Attr]

#version
version=1

#ext_config
ext_name=ext_default
ext_index=0
ext_type=LCD_EXTERN_I2C
ext_status=1

#ext_type_config: value0~0
value_0=0x36    #i2c_addr
value_1=0xff    #i2c_2nd_addr
value_2=0xff    #invalid
value_3=0xff    #cmd_size
value_4=0xff    #i2c_3rd_addr
value_5=0xff    #i2c_4th_addr

#cmd_data
#for fixed cmd_size include all data.
#for dynamic cmd_size: (type, cmd_size, value...);
# type: 0x00=cmd(bit[3:0]=1 for second_addr) with delay(the last value),
#          0xc0=cmd(bit[3:0]=1 for second_addr),
#          0xf0=gpio,
#          0xfd=delay(sum of the values for cmd_size > 1),
#          0xff=ending
# delay: unit in ms
init_on = {
    0xb0,43,0x00,
            0x48,0x09,0x12,0x00,0x23,0x0a,0xfc,0x96,0x77,0x14,0x12,0x0f,0x14,0x0b,0x02,0x31,
            0x3f,0x93,0xf6,0x36,0x52,0xef,0x2b,0x12,0x65,0x22,0x11,0xc8,0x19,0xb1,0x57,0x10,
            0xb0,0xa6,0x01,0xa0,0x0e,0x1a,0x01,0xa3,0x48,0x6e,
    0xff,0,
};
init_off = {
    0xff,0,
};


[Backlight_Attr]

#version
version=1

#name
bl_name=bl_pwm

#level

#bl_level_default_uboot_kernel
bl_level_uboot=100
bl_level_kernel=100

#bl_level_attr
bl_level_max=255
bl_level_min=10
bl_level_mid=128
bl_level_mid_mapping=128

#bl_ctrl_method: BL_CTRL_PWM, BL_CTRL_PWM_COMBO, BL_CTRL_LOCAL_DIMMING, BL_CTRL_EXTERN
bl_method=BL_CTRL_PWM

#bl_power_attr
bl_en_gpio=0
bl_en_gpio_on=1
bl_en_gpio_off=0
bl_on_delay=400
bl_off_delay=100

#pwm on/off delay
pwm_on_delay=80
pwm_off_delay=80

#bl_pwm_port: BL_PWM_A, BL_PWM_B, BL_PWM_C, BL_PWM_D, BL_PWM_E, BL_PWM_F, BL_PWM_VS
pwm_port=BL_PWM_E

#bl_pwm_attr
pwm_method=BL_PWM_POSITIVE # BL_PWM_NEGATIVE, BL_PWM_POSITIVE
pwm_freq=300 # pwm_vs: 1~4(vfreq multiple), other pwm: real freq(unit: Hz)
pwm_duty_max=100 # unit in %
pwm_duty_min=25 # unit in %

#bl_pwm_power
pwm_gpio=1
pwm_gpio_off=0


[panel_misc]
panel_misc_version=1
outputmode=2160p60hz
panel_reverse=0

[tcon_Path]
#version
version = 1
header = 1
data_load_level = 1

#path for default
TCON_BIN_PATH  = /odm/panel/CSOT_ST6451D06_3/p2p_cspi.bin
TCON_DATA_0_BIN_PATH = /odm/panel/tcon_dither.bin
TCON_DATA_1_BIN_PATH = /odm/panel/CSOT_ST6451D06_3/tcon_acc.bin
TCON_DATA_2_BIN_PATH = /odm/panel/CSOT_ST6451D06_3/tcon_od.bin
TCON_DATA_3_BIN_PATH = /param/tcon_demura.bin
TCON_EXT_B0_SPI_BIN_PATH = /param/tcon_p_gamma.bin

#path under kernel
TCON_BIN_PATH_K  = /odm/panel/CSOT_ST6451D06_3/p2p_cspi.bin
TCON_DATA_0_BIN_PATH_K = /odm/panel/tcon_dither.bin
TCON_DATA_1_BIN_PATH_K = /odm/panel/CSOT_ST6451D06_3/tcon_acc.bin
TCON_DATA_2_BIN_PATH_K = /odm/panel/CSOT_ST6451D06_3/tcon_od.bin
TCON_DATA_3_BIN_PATH_K = /mnt/vendor/param/tcon_demura.bin
TCON_EXT_B0_SPI_BIN_PATH_K = /mnt/vendor/param/tcon_p_gamma.bin

[tcon_spi_Attr]

#version
version=0

#block0
demura_lut_offset=0x00000110
demura_lut_size=0x0009B9D0
block0_param_0=0
block0_param_1=0
block0_param_2=0
block0_param_3=0
block0_param_4=0
block0_param_5=0
block0_param_6=0
#block1
p_gamma_offset=0xfe000
p_gamma_size=0x2a
block1_param_0=0
block1_param_1=0
block1_param_2=0
block1_param_3=0
block1_param_4=0
block1_param_5=0
#block2
acc_lut_offset=0
acc_lut_size=0
block2_param_0=0
block2_param_1=0
block2_param_2=0
block2_param_3=0
block2_param_4=0
block2_param_5=0
#block3
auto_flicker_offset=0
auto_flicker_size=0
block3_param_0=0
block3_param_1=0
block3_param_2=0
block3_param_3=0
block3_param_4=0
block3_param_5=0

[end]
end_tag=amlogic_end
