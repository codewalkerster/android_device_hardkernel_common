[start]
start_tag=amlogic_start


[lcd_Attr]

#version
version=2

#basic
model_name=ST6451D06-3
interface=LCD_P2P # LCD_TTL, LCD_LVDS, LCD_VBYONE, LCD_MLVDS, LCD_P2P
lcd_bits=8
screen_width=16
screen_height=9

#timming
h_active=3840
v_active=2160
h_period=5000
v_period=2250
hsync_width=16
hsync_bp=29
hsync_pol=0
vsync_width=6
vsync_bp=17
vsync_pol=0

h_period_min=4360
h_period_max=5760
v_period_min=2240
v_period_max=3135 # pixel_clk / (htotal * (min_fps - 5))
pixle_clk_min=485000000
pixle_clk_max=600000000

#customer
fr_adjust_type=2 # 0-clock, 1-htotal, 2-vtotal, 3-auto_range, 4-hdmi_mode
ss_level=30 # 0-disable, 2000ppm/step
clk_auto_gen=1
pixel_clk=675000000 # unit in Hz

#interface

#p2p_attr
if_attr_0=0x11  #p2p_type: 0x0=ceds, 0x1=cmpi, 0x2=isp, 0x3=epi,
	# 0x10=chpi, 0x11=cspi, 0x12=usit
if_attr_1=12 #lane_num
if_attr_2=0x3210 #channel_sel0[15:0]
if_attr_3=0x7654 #channel_sel0[31:16]
if_attr_4=0xba98 #channel_sel1[15:0]
if_attr_5=0 #channel_sel1[31:16]
if_attr_6=0 #pn_swap
if_attr_7=0 #bit_swap

#phy_attr
if_attr_8=0x5 #vswing_level
if_attr_9=0x1 #preemphasis_level

#power
#power type:(0=cpu_gpio, 1=pmu_gpio, 2=signal, 3=extern, 0xff=ending)
#power index:(point gpios_index, or extern_index, 0xff=invalid)
#power value:(0=output low, 1=output high, 2=input)
#power delay:(unit in ms)

power_on_step = {
    0,0,1,20, #panel power on
    3,0,0,20, #pmu power on
    2,0,0,0,  #signal enable
    0xff,0,0,0, #ending
};

power_off_step = {
    2,0,0,20,  #signal disable
    0,0,0,100, #panel power off
    0xff,0,0,0, #ending
};

#phy_attr
phy_attr_flag=0x1006 #each bit enable one attr behind
phy_attr_0 = 0 #vswing
phy_attr_1 = 0x5fa #vcm
phy_attr_2 = 0x1 #bias
phy_attr_3 = 0 #odt
phy_lane_ctrl = { #attr_12
    0x00000016, #lane0 bit[31:16]amp, bit[15:0]preem
    0x00000016, #lane1 bit[31:16]amp, bit[15:0]preem
    0x00000016, #lane2 bit[31:16]amp, bit[15:0]preem
    0x00000016, #lane3 bit[31:16]amp, bit[15:0]preem
    0x00000016, #lane4 bit[31:16]amp, bit[15:0]preem
    0x00000016, #lane5 bit[31:16]amp, bit[15:0]preem
    0x00000016, #lane6 bit[31:16]amp, bit[15:0]preem
    0x00000016, #lane7 bit[31:16]amp, bit[15:0]preem
    0x00000016, #lane8 bit[31:16]amp, bit[15:0]preem
    0x00000016, #lane9 bit[31:16]amp, bit[15:0]preem
    0x00000016, #lane10 bit[31:16]amp, bit[15:0]preem
    0x00000016, #lane11 bit[31:16]amp, bit[15:0]preem
};

#cus_ctrl
ctrl_attr_flag=0x1  #enable ctrl_attr_0
ctrl_attr_0=0x3  #bit[1:0]=dlg_ctrl
ctrl_attr_0_parm0=1120  #dlg v_period_min
ctrl_attr_0_parm1=3135  #dlg v_period_max = pixel_clk / (htotal * (min_fps - 5))

#custom pinmux flag
custom_pinmux=1

[lcd_ext_Attr]

#version
version=1

#ext_config
ext_name=ext_default
ext_index=0
ext_type=LCD_EXTERN_I2C
ext_status=1
#ext_type_config: value0~0
value_0=0x33  #i2c_addr
value_1=0xff   #i2c_2nd_addr
value_2=0xff   #invalid
value_3=0xff   #cmd_size
value_4=0xff   #i2c_3rd_addr
value_5=0xff   #i2c_4th_addr


init_on = {
	0x21,6,0,40,90,1,91,120,
	0xe0,45,0,0xb,0x00,
		0x48,0x1a,0xa4,0x00,0x2b,0x23,0xfc,0x66,0x7b,0x34,0x32,0x00,0x14,0x14,0x0b,0x0b,
		0x3f,0x93,0xf2,0x36,0x62,0xef,0x2b,0x12,0x66,0x22,0x11,0xc8,0x19,0x51,0x57,0x10,
		0xc0,0xa6,0x01,0xd0,0x0e,0x1a,0x32,0x31,0xc2,0x59,
	0xe0,45,1,0xb,0x00,
		0x58,0x19,0x92,0x00,0x2b,0x23,0xfc,0x66,0x7b,0x33,0x30,0x00,0x10,0x10,0x0b,0x0b,
		0x3f,0x33,0xef,0x35,0x42,0xf1,0x2b,0x62,0x3d,0x22,0x11,0xc8,0x1a,0x81,0x59,0x10,
		0x20,0x8f,0x01,0x90,0x0f,0x1a,0xf2,0xc0,0x0d,0x1e,
	0xff,0
};
init_off = {
	0xff,0
};


[Backlight_Attr]

#version
version=1

#name
bl_name=bl_pwm

#level

#bl_level_default_uboot_kernel
bl_level_uboot=100
bl_level_kernel=100

#bl_level_attr
bl_level_max=255
bl_level_min=10
bl_level_mid=128
bl_level_mid_mapping=128

#bl_ctrl_method: BL_CTRL_PWM, BL_CTRL_PWM_COMBO, BL_CTRL_LOCAL_DIMMING, BL_CTRL_EXTERN
bl_method=BL_CTRL_PWM

#bl_power_attr
bl_en_gpio=0
bl_en_gpio_on=1
bl_en_gpio_off=0
bl_on_delay=100
bl_off_delay=100

#pwm on/off delay
pwm_on_delay=105
pwm_off_delay=105

#bl_pwm_port: BL_PWM_A, BL_PWM_B, BL_PWM_C, BL_PWM_D, BL_PWM_E, BL_PWM_F, BL_PWM_VS
pwm_port=BL_PWM_D

#bl_pwm_attr
pwm_method=BL_PWM_POSITIVE # BL_PWM_NEGATIVE, BL_PWM_POSITIVE
pwm_freq=180 # pwm_vs: 1~4(vfreq multiple), other pwm: real freq(unit: Hz)
pwm_duty_max=100 # unit in %
pwm_duty_min=10 # unit in %

#bl_pwm_power
pwm_gpio=1
pwm_gpio_off=0

